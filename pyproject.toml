[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "koine-suno"
version = "0.1.0"
description = "Respell Koine Greek in its first-century pronunciation for Suno: CLI and MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-SA-4.0" }
authors = [{ name = "Johannes Foulds" }]
keywords = ["koine", "greek", "pronunciation", "ipa", "suno", "mcp"]
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest", "flake8", "black"]

[project.urls]
Repository = "https://github.com/JohnnyFoulds/koine-suno"

[project.scripts]
koine-suno = "koine_suno.cli:main"
koine-suno-mcp = "koine_suno.server:main"
koine-ledger = "koine_suno.ledger_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/koine_suno"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.black]
line-length = 79
target-version = ["py310"]
